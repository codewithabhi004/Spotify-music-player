name: Build My Love Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Package songs and photos
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync app assets
        run: npx cap sync android
      - name: Build installable APK
        run: cd android && ./gradlew assembleDebug
      - name: Name APK download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk My-Love.apk
      - name: Publish installable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: My Love Android build ${{ github.run_number }}
          generate_release_notes: true
          files: My-Love.apk
          fail_on_unmatched_files: true
